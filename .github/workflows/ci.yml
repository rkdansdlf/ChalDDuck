name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Code Quality & Build Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: chaldduck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/chaldduck_test?schema=public"
      # prisma.config.ts 가 마이그레이션·`prisma generate` 에 DIRECT_URL 을 읽는다. 없으면 `npm ci`
      # 의 postinstall(prisma generate)에서 죽는다. 이 CI 는 풀러가 없어 같은 주소를 쓴다.
      DIRECT_URL: "postgresql://postgres:password@localhost:5432/chaldduck_test?schema=public"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check Database Migrations Committed
        run: npm run db:migrations

      - name: Deploy Database Migrations
        run: npm run db:deploy

      - name: Check Prisma Schema in Sync
        run: npm run db:check

      - name: Check Open Decisions (0 Undecided)
        run: npm run decisions

      - name: Audit Server Actions (100% Tested)
        run: npm run audit:actions

      - name: Run ESLint
        run: npm run lint

      # `tsc` 는 `.next/types` 의 라우트 타입(PageProps·LayoutProps)을 쓴다. 그 파일은 빌드나 dev 가
      # 만드는데 이 CI 는 빌드보다 먼저 타입을 검사하므로, 먼저 만들어 둔다. 없으면 tsc 가
      # `Cannot find name 'PageProps'` 로 죽는다.
      - name: Generate Next.js Route Types
        run: npx next typegen

      - name: Check TypeScript Types
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build
