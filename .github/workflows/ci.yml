name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 같은 브랜치에 연달아 푸시하면 앞의 실행은 취소한다 — 낡은 커밋을 끝까지 돌릴 이유가 없다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 이 워크플로우는 저장소를 읽기만 한다.
permissions:
  contents: read

jobs:
  verify:
    name: Code Quality & Build Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: chaldduck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 앱 런타임은 DATABASE_URL, **Prisma CLI(generate·migrate·db:check)는 DIRECT_URL** 을 읽는다
      # (`prisma.config.ts`). 하나만 두면 `npm ci` 의 postinstall(`prisma generate`)에서 바로 죽는다.
      # 여기서는 둘 다 CI 전용 서비스 컨테이너를 가리키므로 같은 주소다.
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/chaldduck_test?schema=public"
      DIRECT_URL: "postgresql://postgres:password@localhost:5432/chaldduck_test?schema=public"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # openai·@supabase/* 가 Node 22 이상을 요구한다(Node 20 에서는 EBADENGINE 경고).
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check Database Migrations Committed
        run: npm run db:migrations

      - name: Deploy Database Migrations
        run: npm run db:deploy

      - name: Check Prisma Schema in Sync
        run: npm run db:check

      - name: Check Open Decisions (0 Undecided)
        run: npm run decisions

      - name: Audit Server Actions (100% Tested)
        run: npm run audit:actions

      # 만들어 놓고 `package.json` 에 안 단 하네스가 없는지 — 있으면 그 하네스는 조용히 안 돈다.
      - name: Check Harness List
        run: npm run test:harness:check

      - name: Run ESLint
        run: npm run lint

      # `tsc` 는 `.next/types` 의 라우트 타입(PageProps·LayoutProps)을 쓴다. 이 파일은 빌드나 dev 가
      # 만들므로, 빌드보다 먼저 타입을 검사하려면 먼저 생성해야 한다.
      - name: Generate Next.js Route Types
        run: npx next typegen

      - name: Check TypeScript Types
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build

  # 업무 규칙 검사 — 스모크(`npm test`)와 서버 액션 하네스.
  #
  # 이 잡이 없던 때(2026-10-11 이전)에는 CI 가 **검사를 하나도 돌리지 않았다.** `main` 에 어느 트리에서도 통과할 수
  # 없는 검사 네 개가 들어와도 몰랐고, 위의 "100% 검증" 은 액션 이름이 테스트 소스에 *나오는지*만 센다 — 통과는
  # 보지 않는다. 여기서 실제로 돌린다.
  #
  # 하네스 목록은 `package.json` 의 `test:*` 에서 **도출**한다(`scripts/ci-harness.mjs`). 새 하네스는 스크립트를
  # 달기만 하면 자동으로 여기 들어온다.
  #
  # `test:drive` 는 돌지 않는다 — 진짜 Supabase 저장소 키가 필요하다 (러너가 이유와 함께 말한다). 저장소를 건드린
  # 변경은 키가 있는 환경에서 `npm run test:drive` 로 따로 본다.
  tests:
    name: Tests (smoke + harness)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: chaldduck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 하네스는 로컬 DB 에서만 돈다(`assertLocalOnly`: localhost·127.0.0.1·::1). 이 서비스 컨테이너가 그것이다.
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/chaldduck_test"
      DIRECT_URL: "postgresql://postgres:password@localhost:5432/chaldduck_test"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy Database Migrations
        run: npm run db:deploy

      - name: Smoke Tests (npm test)
        run: npm test

      # 스모크가 깨져도 하네스는 돈다 — 무엇이 얼마나 깨졌는지 한 번에 보려고. (취소된 경우만 건너뛴다.)
      - name: Server Action Harnesses
        if: ${{ !cancelled() }}
        run: npm run test:harness
