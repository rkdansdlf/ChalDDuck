name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Code Quality & Build Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: chaldduck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/chaldduck_test?schema=public"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check Database Migrations Committed
        run: npm run db:migrations

      - name: Deploy Database Migrations
        run: npm run db:deploy

      - name: Check Prisma Schema in Sync
        run: npm run db:check

      - name: Check Open Decisions (0 Undecided)
        run: npm run decisions

      - name: Audit Server Actions (100% Tested)
        run: npm run audit:actions

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript Types
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build
